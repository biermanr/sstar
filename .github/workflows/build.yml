name: build

on: [push, pull_request]

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Add micromamba to system path
      uses: mamba-org/setup-micromamba@v2
      with:
        environment-name: sstar-build
        environment-file: build-env.yml

    - name: Integration tests only with pytest, but don't generate coverage reports
      run: |
        export R_LIBS=${CONDA_PREFIX}/lib/R/library
        micromamba run -n sstar-build coverage run -m pytest -m integration
        micromamba run -n sstar-build coverage erase

    - name: Unit tests only with pytest, coverage, and generate coverage reports
      run: |
        export R_LIBS=${CONDA_PREFIX}/lib/R/library
        micromamba run -n sstar-build coverage run -m pytest -m "not integration"
        micromamba run -n sstar-build coverage combine
        micromamba run -n sstar-build coverage report -m
        micromamba run -n sstar-build coverage xml
        micromamba run -n sstar-build coverage-badge -f -o coverage.svg

    - name: Commit coverage.svg and push
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add coverage.svg
        git commit -m "Updated coverage.svg" || exit 0
        git push